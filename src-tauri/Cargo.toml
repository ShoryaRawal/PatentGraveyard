[package]
name = "grave-tender"
version = "0.1.0"
description = "GraveTender — the mobile patent assistant"
authors = ["PatentGraveyard Engineering"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "grave_tender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
