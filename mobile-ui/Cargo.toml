[package]
name = "grave-tender-ui"
version = "0.1.0"
edition = "2021"
description = "GraveTender — the mobile patent assistant"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlDivElement",
  "Storage",
  "Navigator",
  "Clipboard",
  "Event",
  "KeyboardEvent",
  "MouseEvent",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "Url",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
