[package]
name = "patent-graveyard"
version = "0.1.0"
edition = "2021"
default-run = "patent-graveyard"
description = "PatentGraveyard — a research-rabbit style patent discovery engine for VC diligence"
authors = ["PatentGraveyard Engineering"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core framework
leptos = { version = "0.8", features = ["islands"] }
leptos_meta = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }
leptos_router = { version = "0.8" }

# Serialization / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# SSR server
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "cors"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# Live data: the server calls SerpApi on the analyst's behalf, so the key
# never reaches the browser.
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false, optional = true }

# Client
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "Window", "Element", "HtmlElement", "DomRect", "MouseEvent", "PointerEvent", "Storage", "Request", "RequestInit", "Response", "Headers"], optional = true }

[features]
# `hydrate` is the default so a plain `trunk build` (which builds the lib for
# wasm32 without extra flags) produces the browser bundle. The server binary
# opts into `ssr` explicitly via `required-features`.
default = ["hydrate"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:uuid",
]

# The server binary only makes sense in SSR mode.
[[bin]]
name = "patent-graveyard"
required-features = ["ssr"]

# Size optimizations for dev builds:
# Setting debug = 1 (line tables only) and split-debuginfo reduces target/ size
# by 70-80% compared to default full debuginfo (debug = 2).
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Size-optimized WASM profile for release builds.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "patent-graveyard"
site-root = "dist"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
